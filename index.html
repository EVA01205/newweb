<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知行共创 CoLab · 校园真实需求共创平台 V1.0</title>
<style>
/* ==========================================================================
   知行共创 CoLab · 校园真实需求共创平台  V1.0
   响应式：桌面端 = 侧边导航 + 多列布局；移动端 = 顶部栏 + 底部标签栏
   ========================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --pri: #0e6b5e;
  --pri-d: #094f45;
  --pri-l: #e6f2ef;
  --acc: #dd7237;
  --acc-l: #fdf1e8;
  --ink: #17211f;
  --ink2: #57665F;
  --ink3: #8B9994;
  --line: #e4eae7;
  --bg: #f5f7f6;
  --card: #ffffff;
  --ok: #118a5e;  --ok-l: #e7f6ef;
  --warn: #b9771a; --warn-l: #fdf4e4;
  --bad: #bf3b2e; --bad-l: #fdeeec;
  --info: #2b6cb0; --info-l: #eaf2fb;
  --r: 14px;
  --sh: 0 1px 2px rgba(18, 48, 44, .04), 0 8px 24px rgba(18, 48, 44, .05);
}

html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Source Han Sans CN", sans-serif;
  font-size: 14px;
  line-height: 1.55;
}

.app { display: flex; min-height: 100vh; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---------------- 桌面端侧边栏 ---------------- */
.sidenav {
  width: 244px; flex: none; position: sticky; top: 0; height: 100vh;
  background: #fff; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 22px 14px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 10px; background: var(--pri); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
}
.brand .t { font-size: 14.5px; font-weight: 700; letter-spacing: -.2px; }
.brand .s { font-size: 10.5px; color: var(--ink3); }

.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px;
  color: var(--ink2); font-size: 13px; cursor: pointer; user-select: none;
}
.nav-item svg { width: 17px; height: 17px; flex: none; }
.nav-item:hover { background: #f3f6f5; }
.nav-item.on { background: var(--pri-l); color: var(--pri-d); font-weight: 600; }
.nav-sec { font-size: 10.5px; color: var(--ink3); letter-spacing: .5px; margin: 18px 11px 7px; }

.side-user {
  margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px;
  display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 10px;
}
.side-user:hover { background: #f7f9f8; }
.side-user .av {
  width: 32px; height: 32px; border-radius: 10px; background: var(--pri); color: #fff;
  display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none;
}
.side-user .n { font-size: 12.5px; font-weight: 600; }
.side-user .d { font-size: 10.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-user .switch { font-size: 11px; color: var(--pri); margin-left: auto; white-space: nowrap; }

/* ---------------- 内容区 ---------------- */
.content { flex: 1; min-width: 0; overflow-y: auto; height: 100vh; padding: 28px 32px 48px; }
.page { max-width: 1120px; margin: 0 auto; }
.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-thumb { background: #d7e0dc; border-radius: 8px; border: 3px solid var(--bg); }

/* ---------------- 移动端顶部栏 / 底部标签 ---------------- */
.appbar { display: none; }
.tabbar { display: none; }

/* ---------------- 通用组件 ---------------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
        padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--sh); }
.card.tight { padding: 12px 14px; }
.sec { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 10px; }
.sec .t { font-size: 13.5px; font-weight: 700; }
.sec .a { font-size: 12px; color: var(--pri); cursor: pointer; }
.muted { color: var(--ink3); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.strong { font-weight: 700; }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.mt6 { margin-top: 6px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; }
.mb6 { margin-bottom: 6px; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.h1 { font-size: 22px; font-weight: 700; margin: 2px 0 4px; letter-spacing: -.4px; }
.h1sub { font-size: 13px; color: var(--ink2); margin: 0 0 16px; }

.btn {
  font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 10px;
  padding: 9px 15px; background: var(--pri); color: #fff; cursor: pointer; white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.99); }
.btn.block { display: block; width: 100%; text-align: center; }
.btn.ghost { background: var(--pri-l); color: var(--pri-d); }
.btn.line { background: #fff; color: var(--ink2); border: 1px solid var(--line); }
.btn.acc { background: var(--acc); }
.btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; padding: 2px 7px;
       border-radius: 6px; background: #f2f5f4; color: var(--ink2); white-space: nowrap; }
.tag.pri { background: var(--pri-l); color: var(--pri-d); }
.tag.acc { background: var(--acc-l); color: #a4521d; }
.tag.ok { background: var(--ok-l); color: var(--ok); }
.tag.warn { background: var(--warn-l); color: var(--warn); }
.tag.bad { background: var(--bad-l); color: var(--bad); }
.tag.info { background: var(--info-l); color: var(--info); }
.tag.line { background: #fff; border: 1px solid var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 14px; }
.chip { font-size: 12.5px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line);
        background: #fff; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: #c9d8d3; }
.chip.on { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }

.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; padding: 5px 0; }
.kv .k { color: var(--ink3); flex: none; }
.kv .v { text-align: right; }

.ring { position: relative; width: 46px; height: 46px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; font-size: 11.5px; font-weight: 700; color: var(--pri); }

.bar { height: 6px; border-radius: 99px; background: #edf1f0; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--pri); }
.bar.acc > i { background: var(--acc); }

/* 需求卡 */
.needgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(318px, 1fr)); gap: 14px; }
.needcard { cursor: pointer; margin-bottom: 0; transition: box-shadow .15s, transform .15s; }
.needcard:hover { box-shadow: 0 10px 28px rgba(18, 48, 44, .10); transform: translateY(-1px); }
.needcard h4 { margin: 0 0 3px; font-size: 14.5px; line-height: 1.42; font-weight: 700; }
.needcard .co { font-size: 11.5px; color: var(--ink2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.verified { display: inline-flex; align-items: center; gap: 2px; color: var(--info);
            background: var(--info-l); font-size: 9.5px; padding: 1px 5px; border-radius: 4px; }
.needmeta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px;
  font-size: 11.5px; color: var(--ink3); }
.needmeta .money { font-size: 16px; font-weight: 700; color: var(--acc); }
.skillrow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }

/* 统计 */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
        min-width: 0; overflow: hidden; }
.stat .n { font-size: 21px; font-weight: 700; color: var(--pri); line-height: 1.2; }
.stat .n.acc { color: var(--acc); }
.stat .l { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }

/* 任务列表 */
.taskgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(352px, 1fr)); gap: 14px; }
.taskgrid .card { margin-bottom: 0; }

/* 时间线 */
.tl { position: relative; padding-left: 22px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 10px; width: 2px; background: var(--line); }
.tl .step { position: relative; padding-bottom: 14px; }
.tl .step:last-child { padding-bottom: 0; }
.tl .step::before { content: ""; position: absolute; left: -21px; top: 5px; width: 8px; height: 8px;
  border-radius: 50%; background: #fff; border: 2px solid var(--line); }
.tl .step.done::before { background: var(--pri); border-color: var(--pri); }
.tl .step.cur::before { background: var(--acc); border-color: var(--acc); }
.tl .st { font-size: 13px; font-weight: 600; }
.tl .sd { font-size: 11.5px; color: var(--ink3); }

/* 分段控制 */
.seg { display: inline-flex; background: #eaeff0; border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg div { font-size: 12.5px; padding: 6px 16px; border-radius: 8px; color: var(--ink2); cursor: pointer; }
.seg div.on { background: #fff; color: var(--pri); font-weight: 700; box-shadow: 0 1px 3px rgba(20,50,45,.10); }

/* 步骤条 */
.steps { display: flex; gap: 6px; margin: 12px 0 4px; }
.steps .s { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink3); }
.steps .s i { display: block; height: 3px; border-radius: 2px; background: #e3e9e7; margin-bottom: 5px; }
.steps .s.on { color: var(--pri); font-weight: 600; }
.steps .s.on i { background: var(--pri); }

/* 提示块 */
.note { background: var(--pri-l); border-radius: 10px; padding: 9px 12px; font-size: 12px;
  color: var(--pri-d); line-height: 1.6; }
.note.acc { background: var(--acc-l); color: #8f4413; }
.note.gray { background: #f1f4f3; color: var(--ink2); }

/* 头像组 */
.avatars { display: flex; align-items: center; }
.avatars .av { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #fff;
  margin-left: -7px; background: #d7e7e2; color: var(--pri-d); font-size: 9.5px;
  display: flex; align-items: center; justify-content: center; font-weight: 700; }
.avatars .av:first-child { margin-left: 0; }

/* 需求详情：桌面两栏 */
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 24px; align-items: start; }
.detail-side { position: sticky; top: 24px; }
.detail-side .side-card { box-shadow: var(--sh); }
.side-cta { display: flex; gap: 9px; margin-top: 12px; }
.side-cta .btn { flex: 1; }

/* 成长档案：桌面两栏 */
.profile-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }

/* 表格 */
table.list { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.list th { text-align: left; color: var(--ink3); font-weight: 600; font-size: 11.5px;
  padding: 7px 6px; border-bottom: 1px solid var(--line); }
table.list td { padding: 9px 6px; border-bottom: 1px solid #f1f4f3; vertical-align: middle; }
table.list tr:last-child td { border-bottom: 0; }

/* 雷达图 */
.radarwrap { display: flex; gap: 14px; align-items: center; }
.legend { font-size: 11.5px; color: var(--ink3); line-height: 1.9; }

/* 作品卡 */
.work { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f1f4f3; }
.work:last-child { border-bottom: 0; padding-bottom: 0; }
.work .thumb { width: 54px; height: 54px; border-radius: 10px; flex: none;
  background: linear-gradient(135deg, #d9ece7, #c7e2dc); display: flex; align-items: center;
  justify-content: center; font-size: 18px; color: var(--pri-d); }
.work .wt { font-size: 13px; font-weight: 600; }
.work .ws { font-size: 11.5px; color: var(--ink3); }

.empty { text-align: center; color: var(--ink3); font-size: 13px; padding: 32px 10px; }

/* 表单 */
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 12.5px; color: var(--ink2); margin-bottom: 6px; font-weight: 600; }
.field input[type="text"], .field input[type="number"], .field textarea, .field select {
  width: 100%; font: inherit; font-size: 13px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: #fff; color: var(--ink); outline: none; }
.field textarea { resize: vertical; min-height: 66px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--pri); }
.opt { display: flex; flex-wrap: wrap; gap: 8px; }
.opt span { font-size: 12.5px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; color: var(--ink2); cursor: pointer; }
.opt span.on { border-color: var(--pri); background: var(--pri-l); color: var(--pri-d); font-weight: 600; }
.help { font-size: 11.5px; color: var(--ink3); margin-top: 5px; }

/* 校验清单 */
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; padding: 5px 0; }
.check .box { width: 16px; height: 16px; flex: none; border-radius: 5px; border: 1.5px solid #cfd9d6;
  background: #fff; margin-top: 1px; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #fff; cursor: pointer; }
.check.on .box { background: var(--pri); border-color: var(--pri); }
.check.on .box::after { content: "✓"; }

/* 发布向导容器 */
.form-wrap { max-width: 720px; }

/* 移动端才显示 / 桌面端才显示 */
.hide-desktop { display: none; }
@media (max-width: 880px) { .hide-desktop { display: block; } }

/* 抽屉 / 弹窗 */
.mask { position: fixed; inset: 0; background: rgba(11, 28, 25, .42); display: none;
        align-items: flex-end; justify-content: center; z-index: 60; }
.mask.on { display: flex; }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; background: var(--bg);
  border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  animation: up .22s cubic-bezier(.2,.8,.3,1); box-shadow: 0 -12px 40px rgba(15,40,35,.18); }
@keyframes up { from { transform: translateY(28%); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet .hd { flex: none; padding: 16px 18px 10px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--line); background: #fff;
  border-radius: 18px 18px 0 0; }
.sheet .hd .t { font-size: 15px; font-weight: 700; }
.sheet .hd .x { font-size: 20px; color: var(--ink3); cursor: pointer; line-height: 1; padding: 0 4px; }
.sheet .bd { overflow-y: auto; padding: 14px 18px 18px; }
.sheet .ft { flex: none; padding: 12px 18px 16px; background: #fff; border-top: 1px solid var(--line);
  display: flex; gap: 10px; }
.sheet .ft .btn { flex: 1; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 8px);
  background: rgba(17, 34, 31, .93); color: #fff; font-size: 12.5px; padding: 10px 16px;
  border-radius: 10px; opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 99;
  max-width: 82%; text-align: center; line-height: 1.45; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ==========================================================================
   移动端（<= 880px）
   ========================================================================== */
@media (max-width: 880px) {
  .app { display: block; }
  .sidenav { display: none; }
  .body { display: block; }

  .appbar {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px;
    position: sticky; top: 0; z-index: 30; background: var(--bg);
  }
  .appbar .avatar { width: 34px; height: 34px; border-radius: 11px; background: var(--pri);
    color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
  .appbar .who { flex: 1; min-width: 0; }
  .appbar .who .n { font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .appbar .who .d { font-size: 11px; color: var(--ink3); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .rolechip { font-size: 11.5px; padding: 6px 11px; border-radius: 999px; background: #fff;
    border: 1px solid var(--line); color: var(--ink2); cursor: pointer; white-space: nowrap; }

  .content { height: auto; overflow: visible; padding: 4px 14px 78px; }
  .page { max-width: none; }

  .h1 { font-size: 19px; }
  .h1sub { font-size: 12.5px; margin-bottom: 14px; }

  .needgrid, .taskgrid { grid-template-columns: 1fr; gap: 11px; }
  .grid3 { gap: 8px; }
  .grid2 { gap: 10px; }
  .grid4 { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 11px 12px; }
  .stat .n { font-size: 19px; }

  .detail-grid { display: block; }
  .detail-side { position: sticky; bottom: 58px; top: auto; z-index: 25;
    padding: 10px 0 10px; margin: 0 -14px; padding-left: 14px; padding-right: 14px;
    background: var(--bg); }
  .detail-side::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px;
    background: linear-gradient(to top, var(--bg), rgba(245, 247, 246, 0)); }
  .detail-side .side-card { display: none; }
  .side-cta { margin-top: 0; }

  .profile-grid { display: block; }
  .form-wrap { max-width: none; }

  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); padding: 7px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tb { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink3); cursor: pointer; line-height: 1.3; }
  .tb i { display: block; width: 18px; height: 18px; margin: 0 auto 3px; }
  .tb i svg { width: 18px; height: 18px; display: block; }
  .tb.on { color: var(--pri); font-weight: 600; }

  .mask { align-items: flex-end; }
  .sheet { max-width: none; border-radius: 20px 20px 0 0; }
  .sheet .hd { border-radius: 20px 20px 0 0; }
  .toast { bottom: 88px; }
}

/* 大屏时把需求卡的三列撑满一些 */
@media (min-width: 1280px) {
  .content { padding: 34px 44px 56px; }
  .page { max-width: 1180px; }
}

</style>
</head>
<body>

<div class="app">
  <!-- ============ 桌面端侧边导航（移动端隐藏） ============ -->
  <aside class="sidenav" id="sidenav"></aside>

  <div class="body">
    <!-- ============ 移动端顶部栏（桌面端隐藏） ============ -->
    <header class="appbar" id="appbar"></header>

    <main class="content" id="main">
      <div class="page" id="page"></div>
    </main>
  </div>

  <!-- ============ 移动端底部标签栏（桌面端隐藏） ============ -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ============ 抽屉 / 弹窗 ============ -->
<div class="mask" id="mask" onclick="A.maskClick(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()">
    <div class="hd"><div class="t" id="sheetTitle">标题</div>
      <div class="x" onclick="A.closeSheet()">×</div></div>
    <div class="bd" id="sheetBody"></div>
    <div class="ft" id="sheetFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   知行共创 CoLab · V1.0 交互原型
   沿用老师 V0.2「学生接企业需求 → 交付 → 报酬」主线，补齐：
   结构化需求 / 能力画像与匹配 / 跨专业组队 / 学分认定 / 托管结算 / 学校治理
   —— 纯前端演示，数据存 localStorage，刷新不丢
   ========================================================================== */

/* ----------------------------- 1. 基础数据 ----------------------------- */
const TRACKS = ['技术开发', '视觉设计', '内容运营', '商科分析', '工程制造', '语言服务'];

/* 线性图标（内联 SVG，避免依赖图标库） */
const SVG = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +

function save() {
  try {

      needs: DB.needs, tasks: DB.tasks, arbs: DB.arbs, courses: DB.courses, seq: DB.seq
    }));
  } catch (e) { /* file:// 下可能受限，忽略 */ }

function load() {
  try {

    if (!raw) return;
    const d = JSON.parse(raw);
    ['needs', 'tasks', 'arbs', 'courses'].forEach(k => { if (d[k]) DB[k] = d[k]; });

/* ----------------------------- 3. 工具 ----------------------------- */
const money = n => '¥' + Number(n).toLocaleString('zh-CN');
/* 简单转义：数据虽多为内置，但用户可在发布向导里输入文本 */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2000);
}

function ring(score) {
  const r = 19, c = 2 * Math.PI * r, off = c * (1 - score / 100);
  return '<div class="ring"><svg width="46" height="46" viewBox="0 0 46 46">' +
    '<circle cx="23" cy="23" r="19" fill="none" stroke="#edf1f0" stroke-width="4"/>' +
    '<circle cx="23" cy="23" r="19" fill="none" stroke="#0e6b5e" stroke-width="4" stroke-linecap="round" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>' +
    '<div class="num">' + score + '</div></div>';
}

function radar(skills) {
  const cx = 84, cy = 78, R = 52, n = skills.length;
  const pt = (i, r) => [cx + R * r * Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n),
                        cy + R * r * Math.sin(-Math.PI / 2 + i * 2 * Math.PI / n)];
  let grid = '';
  [0.25, 0.5, 0.75, 1].forEach(r => {
    grid += '<polygon points="' + skills.map((s, i) => pt(i, r).map(v => v.toFixed(1)).join(',')).join(' ') +
      '" fill="none" stroke="#e6ebe9" stroke-width="1"/>';
  });
  const axes = skills.map((s, i) => {
    const p = pt(i, 1);
    return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) +
      '" stroke="#e6ebe9" stroke-width="1"/>';
  }).join('');
  const shape = skills.map((s, i) => pt(i, s.v / 100).map(v => v.toFixed(1)).join(',')).join(' ');
  const labels = skills.map((s, i) => {
    const p = pt(i, 1.24);
    return '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 3).toFixed(1) +
      '" font-size="8.5" fill="#5c6b68" text-anchor="middle">' + s.n + '</text>';
  }).join('');
  return '<svg viewBox="0 0 168 158" width="168" height="158">' + grid + axes +
    '<polygon points="' + shape + '" fill="rgba(14,107,94,.16)" stroke="#0e6b5e" stroke-width="1.6"/>' +
    labels + '</svg>';
}

function steps(cur) {
  const names = ['认领', '制作', '提交', '验收', '结算'];
  return '<div class="steps">' + names.map((n, i) =>
    '<div class="s ' + (i <= cur ? 'on' : '') + '"><i></i>' + n + '</div>').join('') + '</div>';
}

function statusTag(t) {
  if (t.status === 'doing') {
    return t.overdue ? '<span class="tag bad">已超时</span>' : '<span class="tag warn">制作中</span>';
  }
  if (t.status === 'check') return '<span class="tag info">待验收</span>';
  if (t.status === 'settle') return '<span class="tag acc">待结算</span>';
  return '<span class="tag ok">已结算</span>';
}

        '<button class="btn sm grow" onclick="A.openReview(' + t.id + ')">验收</button></div></div>';

function pagePublish() {
  WIZ = WIZ || { step: 1, title: '', track: '技术开发', brief: '', deliverables: ['成片/上线链接'],
                 criteria: '', days: 14, budget: '', team: true, host: '学校共管账户' };
  const w = WIZ;
  const delivOpts = ['源文件', '成片/上线链接', '数据回执', '使用说明', '版权清单'];
  let body = '';
  if (w.step === 1) {
    body = '<div class="field"><label>需求标题</label><input type="text" id="wTitle" placeholder="例如：门店小程序预约页改版" value="' + esc(w.title) + '"></div>' +
      '<div class="field"><label>所属赛道</label><div class="opt">' +
      TRACKS.map(t => '<span class="' + (w.track === t ? 'on' : '') + '" onclick="A.wTrack(\'' + t + '\')">' + t + '</span>').join('') + '</div></div>' +
      '<div class="field"><label>项目背景（一句话说清目标）</label><textarea id="wBrief" placeholder="现在的问题是什么、希望达到什么效果">' + esc(w.brief) + '</textarea></div>' +
      '<div class="note">结构化 Brief 能让 80% 的返工在发布前就被消灭——这是新版与原版最大的差别之一。</div>';
  } else if (w.step === 2) {
    body = '<div class="field"><label>可交付物（多选）</label><div class="opt">' +
      delivOpts.map(d => '<span class="' + (w.deliverables.indexOf(d) >= 0 ? 'on' : '') + '" onclick="A.wDeliv(\'' + d + '\')">' + d + '</span>').join('') + '</div></div>' +
      '<div class="field"><label>验收标准（逐条可判定的，不要写「好看」）</label>' +
      '<textarea id="wCrit" placeholder="例如：下单步骤 ≤ 3 步；首屏加载 < 1.2s；无第三方水印">' + w.criteria + '</textarea></div>' +
      '<div class="field"><label>工期（天）</label><input type="number" id="wDays" min="3" max="60" value="' + w.days + '"></div>' +
      '<div class="field"><label>是否允许跨专业组队</label><div class="opt">' +
      '<span class="' + (!w.team ? 'on' : '') + '" onclick="A.wTeam(false)">个人承接</span>' +
      '<span class="' + (w.team ? 'on' : '') + '" onclick="A.wTeam(true)">允许组队</span></div></div>' +
      '<div class="note acc">里程碑默认按 30 / 40 / 30 拆三次，验收一段释放一段，企业不怕「付了钱没交付」。</div>';
  } else {
    const est = w.budget || 2000;
    body = '<div class="field"><label>预算（元）</label><input type="number" id="wBudget" min="100" step="100" value="' + est + '">' +
      '<div class="help">平台参考价：同赛道同等体量需求均价 ¥1,860；预算低于 ¥800 会进入「低价预警」。</div></div>' +
      '<div class="field"><label>资金托管方式</label><select id="wHost">' +
      ['学校共管账户', '企业直付（平台留痕）'].map(h => '<option' + (w.host === h ? ' selected' : '') + '>' + h + '</option>').join('') + '</select></div>' +
      '<div class="card tight" style="margin:2px 0 10px"><div class="small strong mb6">发布预览</div>' +
      '<div class="kv"><span class="k">标题</span><span class="v">' + (w.title || '（未填写）') + '</span></div>' +
      '<div class="kv"><span class="k">赛道</span><span class="v">' + w.track + '</span></div>' +
      '<div class="kv"><span class="k">工期</span><span class="v">' + w.days + ' 天</span></div>' +
      '<div class="kv"><span class="k">交付物</span><span class="v">' + (w.deliverables.join('、') || '—') + '</span></div>' +
      '<div class="kv"><span class="k">组队</span><span class="v">' + (w.team ? '允许跨专业组队' : '个人承接') + '</span></div></div>' +
      '<div class="note">将自动匹配 <b>' + (12 + (est > 2000 ? 6 : 0)) + '</b> 位符合技能画像的学生，并推送订阅消息。' +
      '发布后进入平台审核（通常 2 小时内），审核通过即对学生可见。</div>';
  }
  return '<div class="form-wrap"><div class="h1">发布需求</div>' +
    '<div class="h1sub">三步生成一份可被验收、可被结算的 Brief</div>' +
    '<div class="steps"><div class="s ' + (w.step >= 1 ? 'on' : '') + '"><i></i>基本信息</div>' +
    '<div class="s ' + (w.step >= 2 ? 'on' : '') + '"><i></i>交付与验收</div>' +
    '<div class="s ' + (w.step >= 3 ? 'on' : '') + '"><i></i>预算与发布</div></div>' +
    '<div class="card">' + body + '</div>' +
    '<div class="row mt14">' +
    (w.step > 1 ? '<button class="btn line" style="min-width:110px" onclick="A.wStep(-1)">上一步</button>' : '') +
    '<div class="grow"></div>' +
    (w.step < 3 ? '<button class="btn" style="min-width:150px" onclick="A.wStep(1)">下一步</button>'
                : '<button class="btn" style="min-width:170px" onclick="A.publish()">提交审核并发布</button>') +
    '</div></div>';
}

function pageMine() {
  const r = ROLES[S.role];
  const role = S.role;
  const rows = {
    student: [['实名与学籍', '已认证 · 学号 2025****26'], ['收款方式', '微信零钱（免手续费）'], ['接单上限', '每周 2 单（防内卷）']],
    teacher: [['教师身份', '已认证 · 创新创业学院'], ['负责范围', '12 个合作企业 · 3 门课程'], ['验收提醒', '开启（每日 9:00 推送）']],
    enterprise: [['企业认证', '已认证 · 营业执照已核验'], ['对接人', '苏经理 · 138****6721'], ['资金托管', '学校共管账户']],
    school: [['运营身份', '平台运营 · 创客中心'], ['数据权限', '全校汇总（脱敏明细）'], ['审计日志', '全量保留 3 年']]
  }[role];

  return '<div class="h1">' + r.label + '中心</div>' +
    '<div class="h1sub">' + r.desc + '</div>' +
    '<div class="card"><div class="row"><div class="avatar" style="width:42px;height:42px;border-radius:13px;background:#0e6b5e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">' +
    r.avatar + '</div><div class="grow"><div class="strong">' + r.name + '</div>' +
    '<div class="small muted">' + r.desc + '</div></div><button class="btn sm line" onclick="A.openRoles()">切换身份</button></div></div>' +
    '<div class="card tight">' + rows.map(x => '<div class="kv"><span class="k">' + x[0] + '</span><span class="v">' + x[1] + '</span></div>').join('') + '</div>' +
    '<div class="card tight"><div class="small strong mb6">通知</div>' +
    '<div class="kv"><span class="k">待办提醒</span><span class="v">已开启</span></div>' +
    '<div class="kv"><span class="k">微信订阅消息</span><span class="v">已授权 3 类模板</span></div></div>' +
    '<div class="card tight"><div class="small strong mb6">演示数据</div>' +
    '<div class="tiny muted">本原型为纯前端演示，数据存浏览器本地。</div>' +
    '<button class="btn sm line block mt10" onclick="A.reset()">重置演示数据</button></div>' +
    '<div class="note mt10">V1.0 原型 · 沿用「学生—企业—教师」主线，新增组队、学分、托管、治理四层。</div>';
}

/* ----------------------------- 10. 交互动作 ----------------------------- */
const A = {
  go(p) { S.page = p; S.needId = null; render(); document.getElementById('main').scrollTop = 0; },
  back() { S.page = 'square'; S.needId = null; render(); },
  setFilter(f) { S.filter = f; render(); },
  setSeg(s) { S.seg = s; render(); },
  toast(m) { toast(m); },

  openRoles() {
    A.openSheet('切换演示身份',
      Object.keys(ROLES).map(k => '<div class="card tight" style="cursor:pointer" onclick="A.switchRole(\'' + k + '\')">' +
        '<div class="row between"><div><div class="strong">' + ROLES[k].label + ' · ' + ROLES[k].name + '</div>' +
        '<div class="small muted">' + ROLES[k].desc + '</div></div>' +
        '<span class="tag ' + (S.role === k ? 'ok' : 'line') + '">' + (S.role === k ? '当前' : '切换') + '</span></div></div>').join(''), '');
  },

  switchRole(k) {
    S.role = k;
    S.page = TABS[k][0].p;
    S.needId = null; S.seg = 'all';
    A.closeSheet();
    render();
    document.getElementById('main').scrollTop = 0;
    toast('已切换为「' + ROLES[k].label + '」视角');
  },

  openNeed(id) {
    S.needId = id; S.page = 'need'; render();
    document.getElementById('main').scrollTop = 0;
  },

  claim(id) {
    const n = needById(id);
    if (!n) return;
    if (DB.tasks.find(t => t.needId === id && t.mine)) return toast('你已经认领过这个需求了');
    DB.seq += 1;
    DB.tasks.unshift({
      id: DB.seq, needId: id, title: n.title, owner: '林一鸣', mine: true,
      status: 'doing', stage: 0, pay: Math.round((n.budget[0] + n.budget[1]) / 2 / 10) * 10,
      paid: false, submitted: null, link: '', note: '', selfcheck: [false, false, false, false]
    });
    /* 只把自己填进第一个空缺的技能位，其余留给组队 */
    let filled = false;
    n.roles = n.roles.map(r => {
      if (!filled && !r.who) { filled = true; return Object.assign({}, r, { who: '林一鸣' }); }
      return r;
    });
    save();
    toast('认领成功！已锁定档期，请按里程碑推进');
    S.page = 'tasks'; S.seg = 'all'; render();
  },

  applyTeam(id) {
    const n = needById(id);
    if (!n) return;
    toast(n.team ? '组队申请已发出，等待队长或企业确认（演示）' : '该需求为个人承接，无需组队');
  },

  openSubmit(taskId) {
    const t = taskById(taskId);
    if (!t) return;
    const checks = ['交付物齐备且与 Brief 一致', '已自测/自校（无错别字、无报错）', '版权与素材可商用', '数据回执已附'];
    A.openSheet('提交作品 · ' + t.title,
      '<div class="field"><label>作品链接（可访问）</label><input type="text" id="sLink" placeholder="https://" value="' + esc(t.link || '') + '"></div>' +
      '<div class="field"><label>交付说明</label><textarea id="sNote" placeholder="做了什么、怎么用、有哪些已知限制">' + esc(t.note || '') + '</textarea></div>' +
      '<div class="field"><label>提交前自检</label>' +
      checks.map((c, i) => '<div class="check ' + (t.selfcheck[i] ? 'on' : '') + '" id="chk' + i + '" onclick="A.toggleChk(' + i + ')">' +
        '<div class="box"></div><div class="small">' + c + '</div></div>').join('') + '</div>' +
      '<div class="note">提交后进入 72 小时验收期；被打回会回到「制作中」，本次修改计入 ' + (needById(t.needId) ? needById(t.needId).revisions : 2) + ' 次上限。</div>',
      '<button class="btn block" onclick="A.submitWork(' + taskId + ')">确认提交</button>');
    A._chk = t.selfcheck.slice();
  },

  toggleChk(i) {
    A._chk[i] = !A._chk[i];
    document.getElementById('chk' + i).classList.toggle('on', A._chk[i]);
  },

  submitWork(taskId) {
    const t = taskById(taskId);
    const link = (document.getElementById('sLink') || {}).value || '';
    const note = (document.getElementById('sNote') || {}).value || '';
    if (!link) return toast('请先填写作品链接');
    if (A._chk && A._chk.some(x => !x)) return toast('请先勾选全部自检项');
    t.link = link; t.note = note; t.selfcheck = A._chk || [true, true, true, true];
    t.status = 'check'; t.stage = 2;
    t.submitted = '11-24 ' + new Date().toTimeString().slice(0, 5);
    save(); A.closeSheet(); render();
    toast('已提交，等待企业/教师验收');
  },

  timeline(taskId) {
    const t = taskById(taskId);
    if (!t) return;
    const names = ['认领成功', '制作中', '提交作品', '验收', '结算'];
    A.openSheet('任务进度 · ' + t.title,
      '<div class="tl">' + names.map((n, i) => {
        const cls = i < t.stage ? 'done' : (i === t.stage ? 'cur' : '');
        const desc = i === 0 ? '已锁定档期，Brief 与里程碑确认'
          : i === 1 ? '按里程碑推进，可随时提交草稿'
          : i === 2 ? (t.submitted ? '提交于 ' + t.submitted : '待提交')
          : i === 3 ? (t.status === 'check' ? '等待验收（72h 内）' : (t.stage > 3 ? '已通过验收' : '未开始'))
          : (t.paid ? '已完成打款并留痕' : '验收通过后释放');
        return '<div class="step ' + cls + '"><div class="st">' + n + '</div><div class="sd">' + desc + '</div></div>';
      }).join('') + '</div>' +
      (t.link ? '<div class="card tight mt10"><div class="small strong mb6">交付物</div>' +
        '<div class="small muted" style="word-break:break-all">' + t.link + '</div>' +
        (t.note ? '<div class="small muted mt6">说明：' + t.note + '</div>' : '') + '</div>' : ''),
      '<button class="btn block line" onclick="A.closeSheet()">关闭</button>');
  },

  openReview(taskId) {
    const t = taskById(taskId);
    const n = needById(t.needId) || { criteria: [] };
    A.openSheet('验收 · ' + t.title,
      '<div class="card tight"><div class="small strong mb6">学生交付</div>' +
      '<div class="small muted" style="word-break:break-all">' + (t.link || '—') + '</div>' +
      (t.note ? '<div class="small muted mt6">' + t.note + '</div>' : '') + '</div>' +
      '<div class="card tight mt10"><div class="small strong mb6">按 Brief 逐条核验</div>' +
      (n.criteria || []).map(c => '<div class="check on"><div class="box"></div><div class="small">' + c + '</div></div>').join('') +
      '</div>' +
      '<div class="field mt10"><label>验收意见（打回时必填）</label>' +
      '<textarea id="rNote" placeholder="例如：第 2 条验收标准未满足，请补充数据回执"></textarea></div>' +
      '<div class="note">通过后进入待结算，企业释放款项；学生获得企业评分并可计入学分。</div>',
      '<button class="btn block line" onclick="A.reject(' + taskId + ')">打回修改</button>' +
      '<button class="btn block" onclick="A.approve(' + taskId + ')">通过验收</button>');
  },

  approve(taskId) {
    const t = taskById(taskId);
    t.status = 'settle'; t.stage = 3;
    save(); A.closeSheet(); render();
    toast('已通过验收，进入企业待结算队列');
  },

  reject(taskId) {
    const t = taskById(taskId);
    const note = (document.getElementById('rNote') || {}).value || '';
    if (!note.trim()) return toast('打回需要写明具体原因');
    t.status = 'doing'; t.stage = 1; t.feedback = note;
    save(); A.closeSheet(); render();
    toast('已打回，学生将收到具体修改意见');
  },

  release(taskId) {
    const t = taskById(taskId);
    t.status = 'done'; t.stage = 4; t.paid = true;
    save(); render();
    toast('款项已释放，结算凭证已生成');
  },

  auditNeed(id, pass) {
    const n = needById(id);
    if (!n) return;
    if (pass) { n.status = 'open'; n.verified = true; toast('已通过审核，需求已对学生可见'); }
    else { n.status = 'review'; toast('已退回企业补充材料'); }
    save(); render();
  },

  hookCourse(id) {
    const n = needById(id);
    if (!n) return;
    DB.courses.push({ id: DB.courses.length + 1, name: '新建实践课程', cls: '待选择班级', needId: id, joined: 0 });
    save(); render(); toast('已挂牌，请补充课程与班级信息（演示）');
  },

  arbitrate(id, plan) {
    const a = DB.arbs.find(x => x.id === id);
    if (!a) return;
    a.status = 'done';
    save(); render();
    toast('已出具调解方案：' + plan);
  },

  /* ---- 发布向导 ---- */
  /* 每次重渲染前先把当前步骤输入框里的值收回 WIZ，避免点标签时丢掉已填内容 */
  wCapture() {
    if (!WIZ) return;
    const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
    if (WIZ.step === 1) {
      const a = val('wTitle'), b = val('wBrief');
      if (a !== null) WIZ.title = a;
      if (b !== null) WIZ.brief = b;
    }
    if (WIZ.step === 2) {
      const a = val('wCrit'), b = val('wDays');
      if (a !== null) WIZ.criteria = a;
      if (b !== null) WIZ.days = Number(b || 14);
    }
    if (WIZ.step === 3) {
      const a = val('wBudget'), b = val('wHost');
      if (a !== null) WIZ.budget = Number(a || 2000);
      if (b !== null) WIZ.host = b;
    }
  },

  wStep(d) {
    A.wCapture();
    if (WIZ.step === 1 && d > 0 && !String(WIZ.title).trim()) return toast('请先填写需求标题');
    WIZ.step = Math.min(3, Math.max(1, WIZ.step + d));
    render();
  },
  wTrack(t) { A.wCapture(); WIZ.track = t; render(); },
  wDeliv(d) {
    A.wCapture();
    const i = WIZ.deliverables.indexOf(d);
    if (i >= 0) { if (WIZ.deliverables.length > 1) WIZ.deliverables.splice(i, 1); }
    else WIZ.deliverables.push(d);
    render();
  },
  wTeam(v) { A.wCapture(); WIZ.team = v; render(); },

  publish() {
    A.wCapture();
    WIZ.budget = Number(WIZ.budget || 2000);
    DB.seq += 1;
    const n = {
      id: DB.seq, title: WIZ.title || '未命名需求', company: '苏太太电商', verified: false,
      track: WIZ.track, majors: ['人工智能学院'], budget: [Math.round(WIZ.budget * 0.8), WIZ.budget],
      days: WIZ.days, deadline: '12-30',
      skills: [{ n: WIZ.track, w: 60 }, { n: '项目协作', w: 40 }],
      match: 88, team: WIZ.team, roles: WIZ.team ? [{ n: '主责', who: null }, { n: '协作', who: null }] : [],
      status: 'review', brief: WIZ.brief || '（未填写背景）',
      deliverables: WIZ.deliverables.slice(), criteria: (WIZ.criteria || '按 Brief 验收').split(/[；;\n]/).filter(Boolean),
      revisions: 2, ip: '著作权归企业，学生保留署名与作品集展示权',
      milestones: [{ n: '首个里程碑', p: 30 }, { n: '第二阶段', p: 40 }, { n: '终验', p: 30 }],
      bonus: '按验收评分发放效果奖励'
    };
    DB.needs.unshift(n);
    save();
    WIZ = null;
    S.page = 'demands';
    render();
    toast('已提交平台审核，审核通过后自动匹配学生');
  },

  reset() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  },

  /* ---- 抽屉 ---- */
  openSheet(title, body, foot) {
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetBody').innerHTML = body;
    document.getElementById('sheetFoot').innerHTML = foot || '';
    document.getElementById('sheetFoot').style.display = foot ? 'flex' : 'none';
    document.getElementById('mask').classList.add('on');
  },
  closeSheet() { document.getElementById('mask').classList.remove('on'); },
  maskClick(e) { if (e.target.id === 'mask') A.closeSheet(); }
};

/* ----------------------------- 11. 启动 ----------------------------- */
/* 支持 ?role=teacher&page=todo&need=3 深链，便于分享某个视角 / 截图 */
(function initFromUrl() {
  try {
    const q = new URLSearchParams(location.search || '');
    const r = q.get('role');
    const p = q.get('page');
    const need = q.get('need');
    if (r && TABS[r]) { S.role = r; S.page = TABS[r][0].p; }
    if (p && TABS[S.role].some(t => t.p === p)) S.page = p;
    if (need && needById(Number(need))) { S.needId = Number(need); S.page = 'need'; }
  } catch (e) { /* 忽略 */ }
})();

load();
render();

</script>
</body>
</html>
